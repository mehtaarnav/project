[project]
name = "cvtsim"
version = "0.1.0"
requires-python = ">=3.11"
license = {text = "MIT"}
description = "Dynamic simulator for rubber-belt CVTs in Baja SAE cars"
dependencies = ["numpy", "scipy", "matplotlib", "pyyaml", "openpyxl"]
[project.optional-dependencies]
fast = ["numba"]
test = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cvtsim*"]

[tool.setuptools.package-data]
"cvtsim.io" = ["*.yaml", "tuning/*.yaml", "tuning/tunes/*.yaml", "scenarios/*.yaml"]
"cvtsim.viz" = ["fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running physics checks"]
