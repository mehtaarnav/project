overrides:
  dt: 1.25e-07
  t_end: 8.0
parameters:
  base:
    engine:
      rpm:
        value:
        - 2400
        - 2600
        - 2800
        - 3000
        - 3200
        - 3400
        - 3600
        source: BRIEF Kohler CH440 team-restricted chart
      torque:
        value:
        - 25.08
        - 24.54
        - 23.59
        - 22.51
        - 20.88
        - 19.66
        - 18.3
        unit: N*m
        source: BRIEF; below 2400 rpm UNVERIFIED -> held constant (06 A6.1)
      rpm_cut:
        value: 3800
        unit: rpm
        source: 'team rule / ASSUMED governed speed: zero torque here (09 sec 3; 06
          A6.2)'
      governor_band:
        value: 100
        unit: rpm
        source: ASSUMED linear torque cut below rpm_cut (09 sec 3). Chart held at
          18.30 N*m from 3600 rpm up to the cut (UNVERIFIED). 200 reproduces the 06
          taper 3600->3800
      J_e:
        value: 0.05
        unit: kg*m^2
        source: PLACEHOLDER engine+flywheel+fixed primary inertia
      idle_rpm:
        value: 1500
        unit: rpm
        source: PLACEHOLDER initial speed below derived engagement (1725.7 rpm)
    ratio:
      low:
        value: 3.0
        source: BRIEF (nominal; the model's low end is set by the primary hub radius,
          giving 3.026)
      high:
        value: 0.8
        source: BRIEF (not CVTech 0.43); imposed overdrive stop. Full hardware stroke
          would reach ~0.49, limited by the secondary minimum radius
    geometry:
      belt_pitch_length:
        value: 0.895
        unit: m
        source: CVTech BD52-2179-S catalog pitch length (archived CVTech Baja belt
          table, UNVERIFIED secondary); matches team CVT_Inputs workbook L = 0.895
          m
      center_distance:
        value: 0.232
        unit: m
        source: team A/B model; replace with the DR26 car's centres if different
      rp_mech_min:
        value: 0.026416
        unit: m
        source: team CVT_Inputs workbook rPmin = 1.04 in (mechCVT_params.m gives 31.50
          mm; either way the secondary limits the low end)
      rp_mech_max:
        value: 0.09144
        unit: m
        source: stock hardware, science/stock_cvt/mechCVT_params.m:37-40
      rs_mech_min:
        value: 0.04242
        unit: m
        source: stock hardware, science/stock_cvt/mechCVT_params.m:37-40
      rs_mech_max:
        value: 0.09703
        unit: m
        source: stock hardware, science/stock_cvt/mechCVT_params.m:37-40
    primary:
      k_spring:
        value: 13208.0
        unit: N/m
        source: BRIEF
      F_preload:
        value: 683.04
        unit: N
        source: BRIEF; spring force at belt contact = k (min preload 1.683 in + xPi
          0.353 in), team CVT_model_v4
      n_weights:
        value: 3
        source: BRIEF
      m_weight:
        value: 0.275
        unit: kg
        source: BRIEF
      m_cover:
        value: 0.0387
        unit: kg
        source: BRIEF (per weight, moves with weight)
      r_w0:
        value: 0.04445
        unit: m
        source: BRIEF; flyweight COM radius at belt contact (team CVT_Inputs rFly
          = 1.75 in)
      ramp_angle_deg:
        value: 45.0
        source: BRIEF straight-ramp assumption
      kappa:
        value: 0.5
        source: DERIVED 1/(2 tan 45deg), double-face wedge; reproduces brief's ~2260
          rpm; UNVERIFIED vs CAD (05 sec 3)
      stroke:
        value: 0.02548
        unit: m
        source: BRIEF; equals 2 tan(12 deg) x measured radius range 59.94 mm. Operating
          travel is stopped at ratio 0.8 (17.82 mm)
      engagement_gap:
        value: 0.0089662
        unit: m
        source: 'team CVT_Inputs workbook xPi = 0.353 in (Primary Sheave Initial Travel):
          movable-half travel from full open to belt contact; belt rides the hub bearing
          until then'
      m_axial:
        value: 0.8
        unit: kg
        source: PLACEHOLDER movable half + spider axial mass
      c_axial:
        value: 10.0
        unit: N*s/m
        source: ASSUMED (brief); sensitivity run
    secondary:
      k_linear:
        value: 3353.66
        unit: N/m
        source: BRIEF
      F_preload_equiv:
        value: 435.63
        unit: N
        source: BRIEF equivalent preload (assumed to include torsion share, 05 A5.4)
      k_torsion:
        value: 3.93
        unit: N*m/rad
        source: BRIEF
      torsion_preload_deg:
        value: 30.0
        source: BRIEF
      r_cam:
        value: 0.0381
        unit: m
        source: BRIEF
      cam_angle_deg:
        value: 45.0
        source: BRIEF
      stroke:
        value: 0.02448
        unit: m
        source: 'BRIEF. CHECK: measured radii at 12 deg imply 23.22 mm (1.26 mm less);
          travel used to ratio 0.8 is 16.28 mm'
      m_axial:
        value: 0.8
        unit: kg
        source: PLACEHOLDER movable half axial mass
      J_movable:
        value: 0.0015
        unit: kg*m^2
        source: PLACEHOLDER movable half polar inertia
      J_shaft:
        value: 0.002
        unit: kg*m^2
        source: PLACEHOLDER shaft + fixed half polar inertia
      c_axial:
        value: 10.0
        unit: N*s/m
        source: ASSUMED (brief); sensitivity run
    sheave:
      beta_deg:
        value: 12.0
        source: Messick 2018 Fig 4.8; science/eCVT_params_legacy.m:32; docs/design/BELT_DATA.md
          (stock primary measures 11.64 deg). Replaces the brief's 45 deg
      r_outer_margin:
        value: 0.003
        unit: m
        source: PLACEHOLDER sheave rim beyond the maximum mechanical pitch radius
      stop_k:
        value: 1.0e7
        unit: N/m
        source: ASSUMED stop penalty (05 A5.6)
    belt:
      name:
        value: CVTech BD52-2172-S proxy (geometry from the A/B model's BD52-2179-S)
        source: BRIEF
      G_hot:
        value: 30.15e6
        unit: Pa
        source: BRIEF / Messick 2018 thesis (UNVERIFIED), small strain
      G_cold:
        value: 46.71e6
        unit: Pa
        source: BRIEF / Messick 2018 thesis (UNVERIFIED)
      rho:
        value: 1150.0
        unit: kg/m^3
        source: ASSUMED (brief)
      EA:
        value: 243.5e3
        unit: N
        source: BRIEF (UNVERIFIED)
      area:
        value: 0.0003
        unit: m^2
        source: PLACEHOLDER cross-section area
      EI:
        value: 0.05
        unit: N*m^2
        source: PLACEHOLDER bending stiffness
      eta:
        value: 2.0e-06
        unit: s
        source: PLACEHOLDER Kelvin-Voigt time constant (uncalibrated); chosen so the
          highest segment mode has damping ratio ~0.4 (explicit-step stable); low
          modes nearly undamped
      top_width:
        value: 0.03
        unit: m
        source: PLACEHOLDER
      flank_height:
        value: 0.012
        unit: m
        source: PLACEHOLDER
      mu:
        value: 0.3
        source: ASSUMED (brief)
      v_eps:
        value: 0.05
        unit: m/s
        source: PLACEHOLDER friction regularization; convergence-checked
      normal_damping_ratio:
        value: 0.05
        source: PLACEHOLDER flank damping fraction of critical
      c_p:
        value: 1700.0
        unit: J/(kg*K)
        source: ASSUMED rubber specific heat (09 sec 4)
      h_conv:
        value: 40.0
        unit: W/(m^2*K)
        source: ASSUMED film coefficient (09 sec 4)
      f_slip_heat:
        value: 0.5
        source: ASSUMED belt share of flank slip heat (09 sec 4)
      T_amb_C:
        value: 40.0
        unit: degC
        source: ASSUMED ambient in the CVT case (09 sec 4); converted to K on load
    vehicle:
      mass:
        value: 250.0
        unit: kg
        source: BRIEF
      final_drive:
        value: 8.1
        source: BRIEF
      tire_radius:
        value: 0.2921
        unit: m
        source: BRIEF
      Crr:
        value: 0.02
        source: 'SAE 2025-01-5069: off-road tires 0.01-0.02 dynamic, >= 0.02 static
          (brief: 0.015)'
      CdA:
        value: 0.7
        unit: m^2
        source: 'SAE 2025-01-5069: C_d 0.44 x frontal area 1.3 m^2 (PLACEHOLDER) x
          1.25 for rotating tires (docs/theory/10_validation.md)'
      rho_air:
        value: 1.2
        unit: kg/m^3
        source: standard air
      model:
        value: tire
        source: '09 sec 3: vehicle speed is its own state, coupled by tire slip. ''rigid''
          = 06 rigid driveline (v = w_s r_t/G)'
      eta:
        value: 0.9
        source: ASSUMED gearbox + chain efficiency 0.88-0.95 (09 sec 3)
      J_wheels:
        value: 1.2
        unit: kg*m^2
        source: ASSUMED four wheels, 0.25-0.45 each (09 sec 3)
      mu_t:
        value: 0.7
        source: ASSUMED tire peak friction, dirt 0.6-0.8 (09 sec 3)
      s0:
        value: 0.08
        source: ASSUMED slip scale, about 76 % of peak force at s = s0 (09 sec 3)
      v_min:
        value: 0.5
        unit: m/s
        source: numerical slip-ratio floor (09 sec 3)
      b_over_L:
        value: 0.6
        source: PLACEHOLDER static rear weight fraction (09 sec 3)
      h_cg:
        value: 0.5
        unit: m
        source: PLACEHOLDER centre-of-gravity height (09 sec 3)
      wheelbase:
        value: 1.5
        unit: m
        source: PLACEHOLDER (09 sec 3)
    shafts:
      material:
        E: 200.0e9
        nu: 0.3
        source: PLACEHOLDER generic steel
      primary:
        note: 'crankshaft PTO stub: two engine main bearings, sheave overhung'
        stations:
          value:
          - 0.0
          - 0.1
          - 0.14
          - 0.16
          unit: m
        diameters:
          value:
          - 0.03
          - 0.0254
          - 0.0254
          unit: m
          source: PLACEHOLDER
        bearings:
          value:
          - 0.0
          - 0.1
          unit: m
          source: PLACEHOLDER
        sheave_z:
          value: 0.16
          unit: m
          source: PLACEHOLDER
        torque_in_z:
          value: 0.0
          unit: m
          source: PLACEHOLDER crank throw (torque reacted here)
        critical:
          z: 0.1
          D: 0.03
          d: 0.0254
          r: 0.0015
          source: PLACEHOLDER shoulder at outboard main bearing
      secondary:
        note: jackshaft on two bearings, sheave between them, output sprocket outboard
        stations:
          value:
          - 0.0
          - 0.05
          - 0.12
          - 0.15
          unit: m
        diameters:
          value:
          - 0.025
          - 0.025
          - 0.025
          unit: m
          source: PLACEHOLDER
        bearings:
          value:
          - 0.0
          - 0.12
          unit: m
          source: PLACEHOLDER
        sheave_z:
          value: 0.05
          unit: m
          source: PLACEHOLDER
        output_z:
          value: 0.15
          unit: m
          source: PLACEHOLDER
        output_pitch_radius:
          value: 0.04
          unit: m
          source: PLACEHOLDER output gear/sprocket pitch radius
        critical:
          z: 0.12
          D: 0.03
          d: 0.025
          r: 0.0015
          source: PLACEHOLDER shoulder at bearing 2
    sim:
      belt_nodes:
        value: 200
        source: numerical choice (L0 = 4.4 mm; >= 22 nodes in the smallest wrap)
      dt:
        value: 1.25e-07
        unit: s
        source: 'numerical choice: speeds and forces converged to 1e-3 against dt/2
          after engagement (tests/test_system.py); 2.5e-7 missed by up to 1e-3 on
          secondary speed'
      t_end:
        value: 8.0
        unit: s
        source: launch duration (covers the full upshift to 0.8)
  tune:
    description: The brief's clutch set-up (reproduces dr26_default.yaml clutch parameters
      exactly) on the 09 vehicle.
    components:
      primary_spring: brief
      flyweights: brief
      ramp: straight_45
      secondary_spring: brief
      torsion_spring: brief
      helix: straight_45
      surface: offroad
    adjust:
      primary_shim:
        value: 0.0
        unit: m
        source: no shim
      torsion_hole_deg:
        value: 30.0
        source: BRIEF
  parts:
    primary_spring:
      brief:
        description: DR26 primary spring as given in the brief
        k_spring:
          value: 13208.0
          unit: N/m
          source: BRIEF
        F_preload:
          value: 683.04
          unit: N
          source: BRIEF
    flyweights:
      brief:
        description: three weights with covers, as given in the brief
        n_weights:
          value: 3
          source: BRIEF
        m_weight:
          value: 0.275
          unit: kg
          source: BRIEF
        m_cover:
          value: 0.0387
          unit: kg
          source: BRIEF (per weight, moves with weight)
    ramp:
      straight_45:
        description: straight 45 deg ramp, roller wedged between two faces (05 sec
          3)
        type:
          value: straight
          source: BRIEF straight-ramp assumption
        r_w0:
          value: 0.04445
          unit: m
          source: BRIEF
        kappa:
          value: 0.5
          source: DERIVED 1/(2 tan 45 deg) (05 sec 3); UNVERIFIED vs CAD
    secondary_spring:
      brief:
        description: linear spring; the brief's 435.63 N equivalent preload includes
          the torsion share at the brief set-up
        k_linear:
          value: 3353.66
          unit: N/m
          source: BRIEF
        F_preload_equiv:
          value: 435.63
          unit: N
          source: BRIEF equivalent preload (05 A5.4)
        equiv_reference:
          note: set-up at which the equivalent preload was quoted; F_l0 = 435.63 -
            k_t theta_t0 / (r_c tan alpha) = 381.621 N (05 sec 4)
          k_torsion:
            value: 3.93
            unit: N*m/rad
            source: BRIEF
          torsion_preload_deg:
            value: 30.0
            source: BRIEF
          r_cam:
            value: 0.0381
            unit: m
            source: BRIEF
          cam_angle_deg:
            value: 45.0
            source: BRIEF
    torsion_spring:
      brief:
        description: torsion spring; pretwist chosen from the hole positions
        k_torsion:
          value: 3.93
          unit: N*m/rad
          source: BRIEF
        torsion_holes_deg:
          value:
          - 30.0
          source: BRIEF (30 deg); the other hole positions were not supplied
    helix:
      straight_45:
        description: single 45 deg helix
        r_cam:
          value: 0.0381
          unit: m
          source: BRIEF
        angles:
          value:
          - - 0.0
            - 45.0
          unit: '[m, deg]'
          source: BRIEF
        interp:
          value: steps
          source: 09 sec 2
    surface:
      offroad:
        Crr:
          value: 0.02
          source: SAE 2025-01-5069 (off-road tires, 0.01-0.02 dynamic)
